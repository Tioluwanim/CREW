# Local production-like stack:  docker compose up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: crew, POSTGRES_PASSWORD: crew, POSTGRES_DB: crew }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U crew"], interval: 5s, retries: 10 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg://crew:crew@db:5432/crew
      AUTO_CREATE_TABLES: "false"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      CREW_DEMO_MODE: "true"
      PUBLIC_APP_URL: http://localhost:3000
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
volumes: { pgdata: {} }
